<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient Light Shape Tester</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ccircle cx='16' cy='16' r='10' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="toolbar" aria-label="Shape controls">
        <div class="toolbar-group" role="group" aria-label="Add shapes">
          <button type="button" id="add-rectangle">Add rectangle</button>
          <button type="button" id="add-circle">Add circle</button>
          <button type="button" id="add-triangle">Add triangle</button>
        </div>

        <div class="toolbar-group toolbar-group--fields" role="group" aria-label="Selected shape settings">
          <label for="shape-color">Shape color</label>
          <input type="color" id="shape-color" value="#ffffff" aria-label="Selected shape color" />

          <label for="background-color">Background</label>
          <input type="color" id="background-color" value="#000000" aria-label="Canvas background color" />
        </div>

        <div class="toolbar-group" role="group" aria-label="Canvas actions">
          <button type="button" id="delete-shape" disabled>Delete selected</button>
          <button type="button" id="clear-canvas">Clear canvas</button>
          <button type="button" id="fullscreen-toggle" aria-pressed="false">Enter fullscreen</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="instructions" aria-label="Usage instructions">
          <h1>Ambient Light Shape Tester</h1>
          <p>
            Add a shape, drag it on the stage, and use the corner handles to resize. Arrow keys move the selected
            shape, while <kbd>Shift</kbd> + <kbd>Left</kbd>/<kbd>Right</kbd> change width and <kbd>Shift</kbd> +
            <kbd>Up</kbd>/<kbd>Down</kbd> change height. Use the color pickers to adjust the shape or background.
          </p>
        </aside>

        <section class="stage-panel" aria-label="Drawing stage">
          <div class="stage-frame">
            <svg
              id="stage"
              class="stage"
              viewBox="0 0 1000 700"
              preserveAspectRatio="xMidYMid meet"
              role="application"
              aria-label="Shape testing canvas"
              tabindex="0"
            >
              <rect id="stage-background" x="0" y="0" width="1000" height="700" fill="#000000"></rect>
              <g id="shapes-layer"></g>
              <g id="overlay-layer"></g>
            </svg>
          </div>
          <p id="status" class="status" aria-live="polite">No shape selected.</p>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
